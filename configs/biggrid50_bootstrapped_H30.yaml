# === 50-task GridWorld, HEAVILY BOOTSTRAPPED, expert critics ===
# 30-step windows against a 160-step episode cap, so NOTHING completes and
# every advantage ends in a bootstrap through the frozen specialist's critic.
# gae_lambda 0.95 bootstraps inside the window as well.
#
# The constraint is deliberately NOT bootstrapped (residual_scalar: mc). Read
# off the rollout it would measure (1-gamma^30) = 26% of the true gap, which is
# the attenuation bug that kept mu pinned at zero. This run tests the GRADIENT.
#
# Budget: 582,560 global frames/task vs the previous matched run's 583,680
# (0.998x). Both counts include the MC constraint evaluation.
