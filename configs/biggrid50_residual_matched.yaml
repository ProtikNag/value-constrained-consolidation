# === 50-task GridWorld, BELLMAN RESIDUAL, BUDGET-MATCHED to the paper ===
# Global frames/task = (1+1) x 8 envs
#   x 200 steps x 160 iters = 512,000
# Published DUEL = 512,000. Ratio 1.00x. Protocol rule 5.
#
# Local training is deliberately NOT matched (rule 5 says it is free): 64 envs
# and 300 iterations, so the specialists are as good as we can make them.
#
# epsilon is 0.0026, not the 0.0001 asked for. At 8 global envs the pooled
# start-return SD is 0.017, so sqrt(eps)=0.01 would be BELOW the noise and mu
# would climb on sampling error. 0.0026 puts the budget at ~3 SD.
experiment:
  name: biggrid50_residual_matched
  seed: 0
  results_dir: results
  device: auto
  log_every: 50
env:
