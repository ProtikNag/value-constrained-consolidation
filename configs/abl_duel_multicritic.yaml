experiment:
  device: auto
  log_every: 50
  name: abl_duel_multicritic
  results_dir: results
  seed: 0
policy:
  hidden_sizes:
  - 64
  kind: mlp_sharedactor_multicritic
  task_conditioned: true
ppo:
  async_envs: false
  clip_ratio: 0.2
  constraint_episodes: 16
  constraint_every: 5
  ent_coef: 0.01
  eval_episodes: 30
  eval_every: 10
  eval_greedy: true
  eval_greedy_episodes: 30
  eval_seed: 100000
  gae_lambda: 0.95
  global_iters: 250
  global_retention_frac: 0.7
  global_stop_all_tasks: true
  local_iters: 250
  lr: 0.00025
  max_grad_norm: 0.5
  method: constrained
  min_iters: 50
  n_envs: 16
  n_steps: 64
  normalize_advantage: true
  num_minibatches: 4
  past_task_sampling: sample
  patience: 3
  ppo_epochs: 4
  select_best_local: true
  stop_eval_episodes: 10
  stop_eval_every: 50
  task1_iters: 300
  value_mode: mc
  vf_coef: 0.5
trainer:
  cycles_per_task: 1
  eps: 0.04
  eval_all_tasks: false
  kind: ppo
