# === ARCHITECTURE ABLATION on the PUBLISHED DUEL estimator ===
# One shared actor head (unchanged) + an INDEPENDENT critic per
# task. Isolates whether per-task critics are what buys the gain.
#
# EVERYTHING else is the published config verbatim: value_mode mc,
# eps 0.04, eta 0.3, lambda 0.95, 64-step persistent windows, one past
# task sampled per iteration. Only policy.kind differs across the three.
#
# Global rollout frames/task: 512,000 (= the published budget, and the
# same as the residual runs, so all five are directly comparable).
