policy:
  kind: cka_rl
  hidden_sizes:
  - 512
  - 512
  - 256
  task_conditioned: true
duals:
  kind: projected_ascent
  lr: 1.0
  init: 0.0
  max_value: 10.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.04
  eval_all_tasks: false
ppo:
  method: cka_rl
  async_envs: false
  n_envs: 32
  n_steps: 128
  ppo_epochs: 4
  num_minibatches: 4
  clip_ratio: 0.2
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  select_best_local: true
  normalize_advantage: true
  task1_iters: 1000
  local_iters: 1000
  global_iters: 0
  min_iters: 50
  patience: 3
  global_stop_all_tasks: false
  global_retention_frac: 0.7
  stop_eval_every: 0
  stop_eval_episodes: 10
  past_task_sampling: worst
  constraint_episodes: 16
  constraint_every: 5
  eval_episodes: 30
  eval_greedy: true
  eval_greedy_episodes: 30
  eval_seed: 100000
  eval_every: 10
  value_mode: mc
  past_task_sample_n: 3
