# === DUEL on BigGrid v2, frames matched to joint training ===
# Global gradient budget 204.8M transitions = 50,000 collects
# x 32 envs x 128 steps, matching joint's 10000 iters x 5 tasks/iter EXACTLY.
#   task 1      : plain PPO, 1 collect/iter x 412 iters
#   tasks 2..50 : 3 past (worst) + 1 current = 4 collects/iter x 253 iters
# past_task_sample_n 3: at the same frame budget this buys 253 global
# iterations per task instead of 505 at n=1 -- lower-variance past-task
# gradients, half as many policy and dual updates.
# local_iters 1000 = 4.096M/task, FREE per protocol and NOT negotiable: it
# sets the specialist reference refL. At 500 iters a long-path task like 6 is
# still at 0.004 (it only takes off between 500 and 750), so refL would be ~0
# and the constraint would be vacuous exactly where retention is hardest.
# Early stopping is OFF so the budget is actually spent and the match holds.
experiment:
  name: biggrid50v2_cka_rl
  seed: 0
  results_dir: results
  device: auto
  log_every: 50
env:
  family: biggrid
  params:
