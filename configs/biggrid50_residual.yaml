policy:
  kind: mlp_ac_sep
  hidden_sizes:
  - 64
  task_conditioned: true
duals:
  kind: projected_ascent
  lr: 15.0
  init: 0.0
  max_value: 5.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.0001
  eval_all_tasks: false
ppo:
  method: constrained
  async_envs: false
  n_envs: 64
  n_steps: 64
  ppo_epochs: 4
  num_minibatches: 4
  clip_ratio: 0.2
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  select_best_local: true
  normalize_advantage: true
  task1_iters: 300
  local_iters: 300
  global_iters: 250
  min_iters: 50
  patience: 3
  global_stop_all_tasks: true
  global_retention_frac: 0.7
  stop_eval_every: 50
  stop_eval_episodes: 10
  past_task_sampling: sample
  constraint_episodes: 16
  constraint_every: 5
  eval_episodes: 30
  eval_greedy: true
  eval_greedy_episodes: 30
  eval_seed: 100000
  eval_every: 10
  value_mode: residual
  global_gae_lambda: 1.0
  global_n_steps: 200
  past_task_sample_n: 5
