# === 50-task GridWorld, BELLMAN RESIDUAL consolidation ===
# Every task's advantage is A_t = G_t - V_L_i(s_t): full-episode return minus
# that task's own frozen specialist critic, used purely as a BASELINE. The
# constraint scalar is -mean(A_0) from the same rollout, which by telescoping
# IS V_k^{pi_L} - V_k^{pi_phi} exactly. No window, no second estimator, and the
# global critic takes no part. See docs/EXPERIMENT_PROTOCOL.md.
