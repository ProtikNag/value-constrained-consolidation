# === BigGrid v2 -- GENERATED, do not hand-edit ===
# python -m experiments.generate_biggrid_tasks --out configs/biggrid50v2.yaml
#
# goal_in_obs TRUE: the observation is the agent's position one-hot, the
# GOAL's position one-hot, and an egocentric wall patch. Direction is
# computable from the input; v2 hid the goal and the task became memory.
# reward_mode goal_time: terminal bonus (1 - steps/max_steps) for REACHING
# the goal, plus potential-based shaping. The shaping telescopes, so a
# random policy nets ~0; it is path-independent, so detours cost nothing.
# wall_death: entering a wall ENDS the episode.
# view_radius: egocentric window, per task. The patch is always
# (2*view_max+1)^2 so the input width is shared; narrower tasks leave the
# surplus at 0, a third symbol distinct from 'free'.
# start_band: spawns are restricted to this shortest-path distance band,
# which makes PATH LENGTH the difficulty axis. Density is not one: walls
# shrink the reachable region, so dense grids are easier.
#
# Every task validated solvable at generation (see the module docstring).
