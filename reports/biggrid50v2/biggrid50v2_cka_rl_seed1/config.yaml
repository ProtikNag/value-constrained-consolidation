policy:
  kind: cka_rl
  hidden_sizes:
  - 512
  - 512
  - 256
  task_conditioned: true
  pool_size: 5
estimator:
  kind: exact
  episodes_per_eval: 16
  episodes_per_grad: 16
  episodes_per_ref: 64
  baseline: batch_mean
  time_discount_weighting: true
duals:
  kind: projected_ascent
  lr: 1.0
  init: 0.0
  max_value: 10.0
  warm_start: false
  decay_when_stuck: false
  stuck_patience: 10
  stuck_decay: 0.5
  stuck_frac: 0.95
  kp: 0.05
  ki: 0.01
  kd: 0.0
trainer:
  cycles_per_task: 1
  local_steps: 50
  global_steps: 50
  task1_steps: 200
  lr_local: 0.05
  lr_global: 0.05
  optimizer: sgd
  eps: 0.04
  omega: null
  past_task_sampling: all
  entropy_coef: 0.0
  eval_episodes: 32
  eval_all_tasks: false
  eval_probe_every: 25
  report_return: false
  kind: ppo
  local_unconstrained: false
ppo:
  method: cka_rl
  past_task_sampling: worst
  constraint_greedy: false
  eval_noop_enumerate: false
  eval_max_ep_steps: 0
  joint_iters: 2000
  joint_single_iters: 600
  global_bc_coef: 0.0
  clear_policy_clone_cost: 0.01
  clear_value_clone_cost: 0.005
  clear_snapshot_batches: 2
  clear_replay_task_per_step: 1
  recall_distill_cost: 10.0
  recall_popart: true
  recall_popart_beta: 0.0003
  clear_past_frames_per_phase: 0
  async_envs: false
  n_envs: 32
  n_steps: 128
  ppo_epochs: 4
  target_kl: 0.0
  num_minibatches: 4
  clip_ratio: 0.2
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  normalize_advantage: true
  task1_iters: 1000
  local_iters: 1000
  local_iters_per_task: {}
  select_best_local: true
  local_init_fresh: false
  local_max_attempts: 1
  local_stall_at: 0
  local_stall_thr: 0.1
  global_stop_all_tasks: false
  global_retention_frac: 0.7
  global_iters: 0
  min_iters: 50
  patience: 3
  stop_eval_every: 0
  stop_eval_episodes: 10
  constraint_episodes: 16
  constraint_every: 5
  value_mode: mc
  window_H: 20
  residual_baseline: expert
  residual_scalar: rollout
  past_task_sample_n: 3
  past_full_rescale: false
  past_fixed_fraction: 0.0
  global_n_steps: 0
  global_gae_lambda: 0.0
  global_n_envs: 0
